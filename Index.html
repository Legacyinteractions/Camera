<!DOCTYPE html>
<html lang="en-GB">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0a0e13">
<title>PlateWatch DVR</title>
<style>
:root{color-scheme:dark;--bg:#0a0e13;--bg2:#0e141b;--card:#131a23;--card2:#1a232e;--tx:#e8edf5;--mut:#8996a9;--bd:#263140;--acc:#22d3ee;--onacc:#04222b;--red:#ff5d5d;--grn:#34d399;--amb:#fbbf24;--blu:#4da3ff;--r:14px;--nav:64px;--bar:50px}
:root[data-theme=light]{color-scheme:light;--bg:#edf2f7;--bg2:#e2e9f1;--card:#fff;--card2:#f0f4f9;--tx:#0f1722;--mut:#5d6b80;--bd:#d3dce8;--acc:#0891b2;--onacc:#fff;--red:#dc2626;--grn:#059669;--amb:#b45309;--blu:#2563eb}
*{box-sizing:border-box}html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--tx);font:14px/1.45 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;overflow:hidden}
button,select,input{font:inherit;color:var(--tx)}
svg{width:1.2em;height:1.2em;flex:none;vertical-align:-.22em}
#bar{position:fixed;top:0;left:0;right:0;height:calc(var(--bar) + env(safe-area-inset-top,0px));padding:env(safe-area-inset-top,0px) 12px 0;background:var(--bg2);border-bottom:1px solid var(--bd);display:flex;align-items:center;gap:12px;z-index:50}
.brand{display:flex;align-items:center;gap:8px;white-space:nowrap}.brand small{color:var(--mut);font-weight:700;letter-spacing:.1em}
.logo{display:inline-grid;place-items:center;width:30px;height:30px;border-radius:9px;background:linear-gradient(135deg,var(--acc),#6366f1);color:var(--onacc)}.logo svg{width:18px;height:18px}
.barcams{display:flex;flex-wrap:nowrap;gap:6px;overflow:auto;flex:1;min-width:0;scrollbar-width:none}.barcams .bc{flex:none}.barcams::-webkit-scrollbar{display:none}
.bc{display:inline-flex;align-items:center;gap:6px;padding:4px 9px;border-radius:99px;background:var(--card);border:1px solid var(--bd);font-size:12px;white-space:nowrap}
.bc i{width:8px;height:8px;border-radius:50%;background:var(--mut)}.bc.live i{background:var(--grn)}.bc.rec i{background:var(--red);animation:pulse 1s infinite}.bc.err i{background:var(--amb)}
@keyframes pulse{50%{opacity:.25}}
.barr{display:flex;align-items:center;gap:8px}
.chip{font:700 11px ui-monospace,monospace;padding:5px 9px;border-radius:99px;background:var(--card);border:1px solid var(--bd);color:var(--mut);white-space:nowrap}.chip.ok{color:var(--grn);border-color:var(--grn)}.chip.bad{color:var(--red);border-color:var(--red)}.chip.warn{color:var(--amb);border-color:var(--amb)}
.clock{font:600 13px ui-monospace,monospace;color:var(--mut);min-width:64px;text-align:right}
.ib{display:inline-grid;place-items:center;width:34px;height:34px;border-radius:10px;border:1px solid var(--bd);background:var(--card);cursor:pointer}.ib.off{opacity:.45}
#nav{position:fixed;z-index:50;background:var(--bg2);display:flex}
#nav button{background:none;border:0;color:var(--mut);cursor:pointer;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;font-size:11px;position:relative;font-weight:600}
#nav button svg{width:22px;height:22px}#nav button.on{color:var(--acc)}
.badge{position:absolute;top:6px;right:calc(50% - 22px);min-width:17px;height:17px;border-radius:9px;background:var(--red);color:#fff;font:700 10px/17px system-ui;text-align:center;font-style:normal;display:none;padding:0 4px}
main{position:fixed;top:calc(var(--bar) + env(safe-area-inset-top,0px));bottom:calc(var(--nav) + env(safe-area-inset-bottom,0px));left:0;right:0;overflow:auto}
#nav{left:0;right:0;bottom:0;height:calc(var(--nav) + env(safe-area-inset-bottom,0px));padding-bottom:env(safe-area-inset-bottom,0px);border-top:1px solid var(--bd)}#nav button{flex:1}
@media(min-width:900px){#nav{top:calc(var(--bar) + env(safe-area-inset-top,0px));bottom:0;right:auto;width:76px;flex-direction:column;justify-content:flex-start;padding:8px 0;border-top:0;border-right:1px solid var(--bd);height:auto}#nav button{flex:none;height:64px}main{left:76px;bottom:0}}
.view{display:none;padding:12px;max-width:1500px;margin:0 auto}.view.on{display:block}
.toolbar{display:flex;gap:8px;align-items:center;margin-bottom:10px;flex-wrap:wrap}.grow{flex:1}
.btn{display:inline-flex;align-items:center;gap:7px;padding:8px 12px;border-radius:11px;border:1px solid var(--bd);background:var(--card);cursor:pointer;font-weight:600;text-decoration:none;color:var(--tx)}.btn:hover{border-color:var(--acc)}.btn.pri{background:var(--acc);color:var(--onacc);border-color:transparent}.btn.sm{padding:5px 9px;font-size:12px}.btn.on{background:var(--acc);color:var(--onacc);border-color:transparent}.btn.danger{color:var(--red)}
select,input[type=text],input[type=search],input[type=date],input[type=time],input[type=url],input[type=password],input[type=number]{background:var(--card);border:1px solid var(--bd);border-radius:10px;padding:8px 10px;min-width:0}
.seg{display:inline-flex;background:var(--card);border:1px solid var(--bd);border-radius:11px;padding:3px}.seg button{border:0;background:none;padding:5px 11px;border-radius:8px;cursor:pointer;font-weight:600;color:var(--mut)}.seg button.on{background:var(--acc);color:var(--onacc)}

@media(max-width:700px){.grid.g2,.grid.g3{grid-template-columns:1fr}}

.tz{position:absolute;inset:0;transform-origin:0 0;will-change:transform}.tz>video,.tz>img{position:absolute;inset:0;width:100%;height:100%;object-fit:contain;background:#000}.tz canvas{position:absolute;inset:0;width:100%;height:100%;pointer-events:none}
.tt{position:absolute;left:8px;top:8px;display:flex;gap:6px;align-items:center;z-index:3;pointer-events:none}.tt b{background:rgba(0,0,0,.6);color:#fff;padding:4px 8px;border-radius:7px;font-size:12px}
.tch span{background:rgba(0,0,0,.6);color:#fff;padding:4px 7px;border-radius:7px;font:700 11px ui-monospace,monospace;margin-right:4px}.tch .r{background:var(--red)}.tch .a{background:#2563eb}
.tc{position:absolute;right:8px;bottom:8px;z-index:4;display:flex;gap:5px;flex-wrap:wrap;justify-content:flex-end;max-width:calc(100% - 16px)}
.tc button{width:34px;height:34px;border-radius:10px;border:1px solid rgba(255,255,255,.2);background:rgba(10,15,20,.62);color:#fff;display:inline-grid;place-items:center;cursor:pointer;backdrop-filter:blur(8px)}.tc button.on{background:var(--acc);color:var(--onacc);border-color:transparent}.tc button.rec.on{background:var(--red);color:#fff}
.tmsg{position:absolute;left:0;right:0;top:50%;transform:translateY(-50%);text-align:center;color:#b7c2d3;padding:14px;z-index:2;font-size:13px}.tmsg:empty{display:none}
.tile.fs,.tile.pfs{border-radius:0;aspect-ratio:auto}.tile.pfs{position:fixed;inset:0;z-index:90}
/* scene panel */
.scene{margin-top:12px;background:var(--card);border:1px solid var(--bd);border-radius:var(--r);padding:12px}
.scene h3{margin:0 0 6px;font-size:13px;text-transform:uppercase;letter-spacing:.08em;color:var(--mut);display:flex;align-items:center;gap:8px}
.live{width:8px;height:8px;border-radius:50%;background:var(--red);animation:pulse 1.2s infinite}
.sc-row{display:flex;gap:10px;padding:9px 0;border-top:1px solid var(--bd)}.sc-row:first-of-type{border-top:0}.sc-cam{font-weight:700;min-width:96px}.sc-t{flex:1;font-size:15px;line-height:1.5}.sc-m{color:var(--mut);font-size:12px}
/* OSD */
.osd{position:absolute;inset:0;z-index:5;pointer-events:none;color:#fff;display:none;text-shadow:0 1px 3px #000}.tile.fs .osd,.tile.pfs .osd{display:block}
.osd-i{pointer-events:auto;cursor:pointer}
.o-top{position:absolute;left:14px;right:14px;top:calc(10px + env(safe-area-inset-top,0px));display:flex;justify-content:space-between;gap:10px;align-items:flex-start;flex-wrap:wrap}
.o-clock b{font:700 clamp(24px,4vw,42px)/1 ui-monospace,monospace;display:block}.o-clock span{font-size:12px;display:block;opacity:.9}.rc{color:#ff7a7a;font-style:normal;font-weight:700}
.o-stats{display:flex;gap:6px;flex-wrap:wrap;justify-content:flex-end}.o-stats div{background:rgba(0,0,0,.55);border-radius:10px;padding:5px 10px;text-align:center;font-size:10px;text-shadow:none}.o-stats b{display:block;font-size:clamp(15px,2.5vw,22px)}
.o-feed{position:absolute;left:14px;top:calc(96px + env(safe-area-inset-top,0px));bottom:calc(150px + env(safe-area-inset-bottom,0px));width:min(46%,340px);overflow:hidden;-webkit-mask-image:linear-gradient(transparent,#000 8%,#000 92%,transparent);mask-image:linear-gradient(transparent,#000 8%,#000 92%,transparent)}
.o-feed .roll{display:grid;gap:6px;animation:roll var(--d,30s) linear infinite}.o-feed:hover .roll,.o-feed.hold .roll{animation-play-state:paused}
@keyframes roll{from{transform:translateY(0)}to{transform:translateY(-50%)}}

.o-objs{position:absolute;right:14px;top:calc(100px + env(safe-area-inset-top,0px));display:grid;gap:5px;max-width:42%}.o-objs div{background:rgba(0,0,0,.55);border-radius:8px;padding:4px 9px;font-size:12px;text-shadow:none}
.o-bot{position:absolute;left:14px;right:14px;bottom:calc(58px + env(safe-area-inset-bottom,0px));display:grid;gap:6px}
.o-desc{background:rgba(0,0,0,.62);border-radius:10px;padding:8px 11px;font-size:clamp(13px,1.8vw,17px);line-height:1.45;text-shadow:none}
.o-tick{background:rgba(0,0,0,.62);border-radius:10px;overflow:hidden;white-space:nowrap;font-size:12.5px;padding:6px 0;text-shadow:none}.o-tick span{display:inline-block;padding-left:100%;animation:tick var(--d,40s) linear infinite}@keyframes tick{to{transform:translateX(-100%)}}
.o-flag{position:absolute;left:50%;top:22%;transform:translateX(-50%);background:var(--c);color:#fff;font-weight:800;padding:12px 20px;border-radius:14px;font-size:clamp(15px,2.6vw,24px);text-align:center;max-width:90%;animation:flash 1s 5;text-shadow:none}
/* alerts */
.alerts{display:grid;gap:10px;grid-template-columns:repeat(auto-fill,minmax(250px,1fr))}
.ac{background:var(--card);border:1px solid var(--bd);border-left:5px solid var(--c,#4da3ff);border-radius:12px;overflow:hidden;cursor:pointer}.ac:hover{border-color:var(--c)}
.ac .im{aspect-ratio:16/9;background:#000;position:relative}.ac .im img{width:100%;height:100%;object-fit:cover;display:block}.ac .im .cr{position:absolute;left:6px;bottom:6px;height:30px;width:auto;border:1px solid #fff;border-radius:4px}
.ac .bd{padding:8px 10px}.ac b{display:block}.ac small{color:var(--mut)}.sev{display:inline-block;font:700 10px ui-monospace,monospace;padding:2px 7px;border-radius:99px;background:var(--c);color:#000;margin-right:6px}
.empty{color:var(--mut);text-align:center;padding:30px}
/* playback */
.player{position:relative;background:#000;border-radius:var(--r);overflow:hidden;aspect-ratio:16/9;max-height:62vh;margin:0 auto;border:1px solid var(--bd)}.player video{width:100%;height:100%;object-fit:contain;display:block}
.player.fs{border-radius:0;aspect-ratio:auto;max-height:none;position:fixed;inset:0;z-index:88}
.pbmsg{position:absolute;inset:0;display:grid;place-items:center;color:#9fb0c6;text-align:center;padding:20px;pointer-events:none}.pbmsg:empty{display:none}.pbtime{position:absolute;left:10px;top:8px;background:rgba(0,0,0,.6);color:#fff;padding:3px 9px;border-radius:8px;font:600 13px ui-monospace,monospace}
.pbfs-osd{position:absolute;inset:0;z-index:6;pointer-events:none;color:#fff;display:none;text-shadow:0 1px 3px #000}.player.fs .pbfs-osd{display:block}
.pbfs-osd .osd-i{pointer-events:auto;cursor:pointer}
.pbfs-osd .o-top{position:absolute;left:14px;right:14px;top:calc(10px + env(safe-area-inset-top,0px));display:flex;justify-content:space-between;gap:10px;align-items:flex-start;flex-wrap:wrap}
.pbfs-osd .o-clock b{font:700 clamp(24px,4vw,42px)/1 ui-monospace,monospace;display:block}.pbfs-osd .o-clock span{font-size:12px;display:block;opacity:.9}
.pbfs-osd .o-stats{display:flex;gap:6px;flex-wrap:wrap;justify-content:flex-end}.pbfs-osd .o-stats div{background:rgba(0,0,0,.55);border-radius:10px;padding:5px 10px;text-align:center;font-size:10px;text-shadow:none}.pbfs-osd .o-stats b{display:block;font-size:clamp(15px,2.5vw,22px)}
.pbfs-osd .o-feed{position:absolute;left:14px;top:calc(96px + env(safe-area-inset-top,0px));bottom:calc(160px + env(safe-area-inset-bottom,0px));width:min(46%,340px);overflow:hidden;-webkit-mask-image:linear-gradient(transparent,#000 8%,#000 92%,transparent);mask-image:linear-gradient(transparent,#000 8%,#000 92%,transparent)}
.pbfs-osd .o-feed .roll{display:grid;gap:6px;animation:roll var(--d,30s) linear infinite}
.pbfs-osd .o-objs{position:absolute;right:14px;top:calc(100px + env(safe-area-inset-top,0px));display:grid;gap:5px;max-width:42%}.pbfs-osd .o-objs div{background:rgba(0,0,0,.55);border-radius:8px;padding:4px 9px;font-size:12px;text-shadow:none}
.pbfs-osd .o-bot{position:absolute;left:14px;right:14px;bottom:calc(112px + env(safe-area-inset-bottom,0px));display:grid;gap:6px}
.pbfs-osd .o-desc{background:rgba(0,0,0,.62);border-radius:10px;padding:8px 11px;font-size:clamp(13px,1.8vw,17px);line-height:1.45;text-shadow:none}
.pbfs-osd .o-tick{background:rgba(0,0,0,.62);border-radius:10px;overflow:hidden;white-space:nowrap;font-size:12.5px;padding:6px 0;text-shadow:none}.pbfs-osd .o-tick span{display:inline-block;padding-left:100%;animation:tick var(--d,40s) linear infinite}
.pbfs-osd .o-al{display:flex;gap:8px;align-items:center;background:rgba(0,0,0,.6);border-left:5px solid var(--c,#4da3ff);border-radius:9px;padding:6px 9px;font-size:12.5px;text-shadow:none}.pbfs-osd .o-al b{display:block}.pbfs-osd .o-al small{opacity:.75}
.pbfs-osd .o-al.new{animation:flash 1s 3}
.pbfs-controls{position:absolute;left:0;right:0;bottom:0;z-index:7;display:none;background:linear-gradient(transparent,rgba(0,0,0,.85));padding:12px 12px calc(12px + env(safe-area-inset-bottom,0px))}
.player.fs .pbfs-controls{display:flex;flex-direction:column;gap:8px}
.pbfs-controls .transport{margin:0;justify-content:center}
.pbfs-controls .pbinfo{color:#dbe4ef;margin:0}
.pbfs-controls .tb{background:rgba(20,28,36,.85);border-color:rgba(255,255,255,.25);color:#fff}
.pbfs-controls .tb.big{background:var(--acc);color:var(--onacc)}
.tlwrap{position:relative;margin-top:10px;background:var(--card);border:1px solid var(--bd);border-radius:12px;height:96px;touch-action:none;cursor:pointer}.tlwrap canvas{width:100%;height:100%;display:block}
.tltip{position:absolute;top:-34px;background:#000d;color:#fff;font-size:12px;padding:4px 8px;border-radius:7px;pointer-events:none;display:none;white-space:nowrap;z-index:3}
.tlbtns{display:flex;gap:6px;align-items:center;margin-top:8px;flex-wrap:wrap}.legend{margin-left:auto;color:var(--mut);font-size:11px}.legend i{display:inline-block;width:10px;height:10px;border-radius:3px;margin:0 4px 0 10px;vertical-align:-1px}
.transport{display:flex;gap:6px;justify-content:center;align-items:center;margin-top:12px;flex-wrap:wrap}
.tb{min-width:46px;height:46px;border-radius:13px;border:1px solid var(--bd);background:var(--card);cursor:pointer;display:inline-flex;align-items:center;justify-content:center;gap:2px;padding:0 10px;font-weight:700}.tb:hover{border-color:var(--acc)}.tb.big{min-width:64px;background:var(--acc);color:var(--onacc);border-color:transparent}.tb.big svg{width:26px;height:26px}.tb small{font-size:10px}.tb.txt{min-width:58px}
.pbinfo{text-align:center;color:var(--mut);font-size:12px;margin-top:8px}
/* settings, cameras, sheet, modal */
.card{background:var(--card);border:1px solid var(--bd);border-radius:var(--r);padding:14px;margin-bottom:12px}.card h3{margin:0 0 10px;font-size:15px}.card h4{margin:12px 0 6px;color:var(--mut);font-size:12px;text-transform:uppercase;letter-spacing:.08em}
.set-row{display:flex;align-items:center;gap:12px;justify-content:space-between;padding:8px 0;border-top:1px solid var(--bd)}.set-row:first-of-type{border-top:0}.set-row label{flex:1}.set-row small{display:block;color:var(--mut);font-size:11.5px}.set-row input[type=range]{width:min(44%,220px)}
.tog{position:relative;width:46px;height:26px;flex:none}.tog input{opacity:0;position:absolute;inset:0;width:100%;height:100%;margin:0;cursor:pointer;z-index:2}.tog span{position:absolute;inset:0;background:var(--bd);border-radius:99px;transition:.2s}.tog span::after{content:'';position:absolute;top:3px;left:3px;width:20px;height:20px;border-radius:50%;background:#fff;transition:.2s}.tog input:checked+span{background:var(--grn)}.tog input:checked+span::after{transform:translateX(20px)}
.rules{width:100%;border-collapse:collapse;font-size:13px}.rules td,.rules th{padding:7px 6px;border-top:1px solid var(--bd);text-align:left;vertical-align:middle}.rules th{color:var(--mut);font-size:11px;text-transform:uppercase}
.camrow{display:flex;gap:12px;align-items:center;padding:10px 0;border-top:1px solid var(--bd)}.camrow:first-child{border-top:0}.camrow .nm{flex:1}.camrow small{color:var(--mut);display:block}
#sheet{display:none;position:fixed;inset:0;z-index:80;background:var(--bg);flex-direction:column}#sheet.show{display:flex}.sht{display:flex;align-items:center;gap:10px;padding:10px 12px;border-bottom:1px solid var(--bd);background:var(--card);padding-top:calc(10px + env(safe-area-inset-top,0px))}.sht b{flex:1}
#shBody{flex:1;overflow:auto;padding:12px;max-width:960px;width:100%;margin:0 auto}.dimg{width:100%;border-radius:12px;background:#000;display:block}.dcr{height:60px;border-radius:6px;border:1px solid var(--bd);margin-top:8px}
.info{background:var(--card);border:1px solid var(--bd);border-radius:12px;padding:2px 12px;margin-top:10px}.ir{display:flex;justify-content:space-between;gap:12px;padding:9px 0;border-top:1px solid var(--bd)}.ir:first-child{border-top:0}.ir span{color:var(--mut)}.ir b{text-align:right;word-break:break-word}
.row{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}
#modal{display:none;position:fixed;inset:0;z-index:85;background:rgba(0,0,0,.6);place-items:center;padding:14px}#modal.show{display:grid}.mbox{background:var(--card);border:1px solid var(--bd);border-radius:16px;padding:16px;width:min(560px,100%);max-height:90vh;overflow:auto}.mbox label{display:block;margin:10px 0 4px;color:var(--mut);font-size:12px}.mbox input,.mbox select{width:100%}
#login{display:none;position:fixed;inset:0;z-index:100;background:var(--bg);place-items:center}#login.show{display:grid}.lbox{display:grid;gap:12px;text-align:center;width:min(320px,90%)}#lerr{color:var(--red)}
#toasts{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(var(--nav) + 14px + env(safe-area-inset-bottom,0px));z-index:120;display:grid;gap:6px;pointer-events:none}@media(min-width:900px){#toasts{bottom:18px}}
.toast{background:var(--card2);border:1px solid var(--bd);border-radius:11px;padding:9px 14px;box-shadow:0 6px 20px rgba(0,0,0,.4);animation:fade 4s forwards}.toast.err{border-color:var(--red)}@keyframes fade{0%,85%{opacity:1}100%{opacity:0}}
.hint{color:var(--mut);font-size:12px}

</style>
</head>
<body>
<header id="bar">
  <div class="brand"><span class="logo" data-i="shield"></span><b>PlateWatch</b><small>DVR</small></div>
  <div class="barcams" id="barcams"></div>
  <div class="barr">
    <span class="chip" id="bAI" title="On-device AI">AI</span>
    <span class="chip" id="bApi" title="Backend">Backend</span>
    <span class="chip" id="bStor" title="Recording storage"></span>
    <span class="clock" id="bClock"></span>
    <button class="ib" id="bSound" data-i="speaker" title="Alert sounds on/off"></button>
    <button class="ib" id="bTheme" data-i="theme" title="Light / dark"></button>
  </div>
</header>
<nav id="nav">
  <button data-v="live" class="on" data-i="camera"><span>Live</span></button>

<script>

 full:'<path d="M8 3H5a2 2 0 0 0-2 2v3m18 0V5a2 2 0 0 0-2-2h-3m0 18h3a2 2 0 0 0 2-2v-3M3 16v3a2 2 0 0 0 2 2h3"/>',close:'<line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/>',

 theme:'<circle cx="12" cy="12" r="9"/><path d="M12 3a9 9 0 0 1 0 18z" fill="currentColor"/>',shield:'<path d="M12 3l8 3v6c0 5-3.5 8-8 9-4.5-1-8-4-8-9V6z"/><circle cx="12" cy="11" r="2.5"/>',
 film:'<rect x="3" y="4" width="18" height="16" rx="2"/><polygon points="10 9 16 12 10 15" fill="currentColor" stroke="none"/>',sliders:'<path d="M4 6h9M17 6h3M4 12h3M11 12h9M4 18h11M19 18h1"/><circle cx="15" cy="6" r="2"/><circle cx="9" cy="12" r="2"/><circle cx="17" cy="18" r="2"/>',
 speaker:'<polygon points="11 5 6 9 2 9 2 15 6 15 11 19" fill="currentColor"/><path d="M15.5 8.5a5 5 0 0 1 0 7M19 5a10 10 0 0 1 0 14"/>',mute:'<polygon points="11 5 6 9 2 9 2 15 6 15 11 19" fill="currentColor"/><line x1="22" y1="9" x2="16" y2="15"/><line x1="16" y1="9" x2="22" y2="15"/>',
 alert:'<path d="M18 8a6 6 0 0 0-12 0c0 7-3 9-3 9h18s-3-2-3-9"/><path d="M13.7 21a2 2 0 0 1-3.4 0"/>',grid:'<rect x="3" y="3" width="7" height="7" rx="1.5"/><rect x="14" y="3" width="7" height="7" rx="1.5"/><rect x="3" y="14" width="7" height="7" rx="1.5"/><rect x="14" y="14" width="7" height="7" rx="1.5"/>',
 target:'<circle cx="12" cy="12" r="8"/><circle cx="12" cy="12" r="3"/><path d="M12 2v4M12 18v4M2 12h4M18 12h4"/>',plus:'<line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/>',
 download:'<path d="M12 3v12M7 10l5 5 5-5M4 20h16"/>',trash:'<path d="M4 7h16M10 11v6M14 11v6M6 7l1 13h10l1-13M9 7V4h6v3"/>',edit:'<path d="M4 20h4L19 9l-4-4L4 16z"/>',zone:'<rect x="4" y="5" width="16" height="14" rx="1" stroke-dasharray="3 3"/>',
 eye:'<path d="M2 12s4-7 10-7 10 7 10 7-4 7-10 7S2 12 2 12z"/><circle cx="12" cy="12" r="3"/>',user:'<circle cx="12" cy="8" r="4"/><path d="M4 21a8 8 0 0 1 16 0"/>',car:'<path d="M3 17v-4l2-6h14l2 6v4z"/><circle cx="7.5" cy="17" r="1.6"/><circle cx="16.5" cy="17" r="1.6"/>',folder:'<path d="M3 7a2 2 0 0 1 2-2h4l2 2h8a2 2 0 0 1 2 2v9a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/>'};
const ic=n=>`<svg viewBox='0 0 24 24' fill='none' stroke='currentColor' stroke-width='2' stroke-linecap='round' stroke-linejoin='round' aria-hidden='true'>${ICONS[n]||''}</svg>`;
const setI=(el,n)=>{if(el)el.innerHTML=ic(n)};
const hydrate=(root=document)=>$$('[data-i]',root).forEach(b=>{if(!b.dataset.hy){b.dataset.hy=1;b.insertAdjacentHTML('afterbegin',ic(b.dataset.i))}});

/* ---------- storage lives in the browser ---------- */
const API={online:true,ffmpeg:false};
const CID=Math.random().toString(36).slice(2);
const audit=a=>{DB.audit(a)};
function toast(msg,type){const t=document.createElement('div');t.className='toast '+(type||'');t.textContent=msg;$('#toasts').appendChild(t);setTimeout(()=>t.remove(),4200)}

/* ---------- settings ---------- */
const DEF={
 ai:{minScore:.5,fps:8,ocr:true,region:'uk'},
 follow:{on:false,target:'auto',classes:['person','car','truck','motorcycle','bus','dog'],minZoom:1,maxZoom:4,smooth:.12,pad:2.2,hold:4,plateZoom:true,capture:true,onlyDanger:false},
 rec:{mode:'motion',seg:30,pre:5,post:15,bitrate:2500000,maxGB:20,retainDays:30},
 narr:{on:true,mode:'changes',interval:30,voice:'',rate:1,pitch:1,vol:1,arrivals:true,detail:'normal',quiet:false,quietFrom:'22:00',quietTo:'06:00',minGap:6},
 sound:{on:true,vol:.7},
 rules:{},
 notify:{browser:true,ntfy:'',ntfyServer:'https://ntfy.sh',webhook:'',minSev:'high'},
 privacy:{mask:'off'},
 ui:{layout:'auto',theme:'dark'}
};
const merge=(d,s)=>{if(Array.isArray(d))return Array.isArray(s)?s:d;if(d&&typeof d==='object'){const o={};for(const k of new Set([...Object.keys(d),...Object.keys(s&&typeof s==='object'?s:{})]))o[k]=k in d?merge(d[k],s&&s[k]):s[k];return o}return s===undefined?d:s};
let S=merge(DEF,lget('pw_settings',{}));
let saveT=0;
function saveSettings(){lset('pw_settings',S)}
const getp=(o,p)=>p.split('.').reduce((a,k)=>a&&a[k],o);
const setp=(o,p,v)=>{const ks=p.split('.');const l=ks.pop();ks.reduce((a,k)=>a[k]=a[k]||{},o)[l]=v};
const CAMDEF={id:'cam1',name:'Camera 1',type:'device',facing:'rear',deviceId:'',url:'',fps:6,enabled:true,detect:true,rec:'inherit',zones:[]};
let CAMCFG=lget('pw_cams',null)||[Object.assign({},CAMDEF)];
const saveCams=()=>{lset('pw_cams',CAMCFG)};
let WATCH=lget('pw_watch',[]);
const saveWatch=()=>{lset('pw_watch',WATCH)};
const matchPlate=p=>{const e=WATCH.find(w=>w.plate===p);if(e)return{w:e,exact:true};if(p.length>=5){const f=WATCH.find(w=>lev(w.plate,p)<=1);if(f)return{w:f,exact:false}}return null};
function lev(a,b){const m=[];for(let i=0;i<=a.length;i++)m[i]=[i];for(let j=0;j<=b.length;j++)m[0][j]=j;for(let i=1;i<=a.length;i++)for(let j=1;j<=b.length;j++)m[i][j]=Math.min(m[i-1][j]+1,m[i][j-1]+1,m[i-1][j-1]+(a[i-1]===b[j-1]?0:1));return m[a.length][b.length]}
async function loadAll(){try{await DB.init()}catch(e){API.online=false}}

'use strict';
/* Storage inside the browser (IndexedDB), with an optional folder for recordings. Replaces the server. */
const fnv=s=>{let h=2166136261;for(let i=0;i<s.length;i++){h^=s.charCodeAt(i);h=Math.imul(h,16777619)}return('00000000'+(h>>>0).toString(16)).slice(-8).repeat(8)};
async function sha(s){try{if(crypto&&crypto.subtle){const b=await crypto.subtle.digest('SHA-256',new TextEncoder().encode(s));return[...new Uint8Array(b)].map(x=>x.toString(16).padStart(2,'0')).join('')}}catch{}return fnv(s)}
const DB={db:null,folder:null,q:Promise.resolve(),lastH:'0',
  open(){return new Promise((ok,no)=>{if(this.db)return ok(this.db);let r;try{r=indexedDB.open('plate-watch-dvr',1)}catch(e){return no(e)}
    r.onupgradeneeded=()=>{const d=r.result;d.createObjectStore('events',{keyPath:'id'}).createIndex('t','t');d.createObjectStore('recs',{keyPath:'name'}).createIndex('t','t');d.createObjectStore('chunks',{keyPath:['name','i']});d.createObjectStore('audit',{autoIncrement:true});d.createObjectStore('kv')};
    r.onsuccess=()=>{this.db=r.result;ok(this.db)};r.onerror=()=>no(r.error)})},
  async t(stores,mode,fn){const d=await this.open();return new Promise((ok,no)=>{const tx=d.transaction(stores,mode);let rq;try{rq=fn(tx)}catch(e){return no(e)}tx.oncomplete=()=>ok(rq&&'result' in rq?rq.result:undefined);tx.onerror=()=>no(tx.error);tx.onabort=()=>no(tx.error)})},
  async init(){await this.open();try{const rows=await this.t('audit','readonly',tx=>tx.objectStore('audit').getAll());if(rows.length)this.lastH=rows[rows.length-1].h}catch{}
    try{this.folder=await this.t('kv','readonly',tx=>tx.objectStore('kv').get('dir'))||null}catch{}
    try{const stale=(await this.t('recs','readonly',tx=>tx.objectStore('recs').getAll())).filter(r=>r.open);for(const r of stale){let size=0,n=0;if(r.where!=='folder'){const ch=await this.t('chunks','readonly',tx=>tx.objectStore('chunks').getAll(IDBKeyRange.bound([r.name,0],[r.name,Number.MAX_SAFE_INTEGER])));ch.forEach(c=>{size+=c.blob.size;n++})}await this.recEnd(r.name,{size,dur:Math.max(r.dur||0,n*2000)})}}catch{}
    setInterval(()=>this.prune().catch(()=>{}),3600e3);setTimeout(()=>this.prune().catch(()=>{}),4000)},
  /* events */
  addEvent(ev){return this.t('events','readwrite',tx=>{tx.objectStore('events').put(ev)})},
  events(o){o=o||{};return this.open().then(d=>new Promise((ok,no)=>{const out=[],tx=d.transaction('events','readonly'),rq=tx.objectStore('events').index('t').openCursor(IDBKeyRange.bound(o.since||0,o.until||9e15),'prev');rq.onsuccess=()=>{const c=rq.result;if(!c||out.length>=(o.limit||300)){ok(out);return}if(!o.cam||c.value.cam===o.cam)out.push(c.value);c.continue()};rq.onerror=()=>no(rq.error)}))},
  delEvent(id){return this.t('events','readwrite',tx=>{tx.objectStore('events').delete(id)})},
  async exportCsv(){const l=await this.events({limit:1e5}),q=v=>'"'+String(v==null?'':v).replace(/"/g,'""')+'"';const rows=[['time','camera','severity','kind','title','plate','text'].join(',')].concat(l.map(e=>[new Date(e.t).toISOString(),e.camName||e.cam,e.sev,e.kind,e.title,e.plate,e.text].map(q).join(',')));
    const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([rows.join('\n')],{type:'text/csv'}));a.download='alerts.csv';a.click();audit('Exported alerts')},
  /* recordings */
  recStart(m){return this.t('recs','readwrite',tx=>{tx.objectStore('recs').put(m)})},
  recChunk(name,i,blob){return this.t('chunks','readwrite',tx=>{tx.objectStore('chunks').put({name,i,blob})})},
  async recEnd(name,patch){const m=await this.t('recs','readonly',tx=>tx.objectStore('recs').get(name));if(!m)return;Object.assign(m,patch,{open:false});await this.t('recs','readwrite',tx=>{tx.objectStore('recs').put(m)});return m},
  async recs(cam,from,to){const l=await this.t('recs','readonly',tx=>tx.objectStore('recs').getAll()),now=Date.now();return l.filter(r=>(!cam||r.cam===cam)&&r.t<to&&r.t+(r.open?now-r.t:(r.dur||0))>from).map(r=>r.open?Object.assign({},r,{dur:now-r.t}):r).sort((a,b)=>a.t-b.t)},
  async openSink(cam,tag,type,t0){
    const ext=/mp4/.test(type)?'mp4':'webm',d=new Date(t0),cid=String(cam.id).replace(/[^\w-]/g,'').slice(0,24),tg=String(tag).replace(/[^\w-]/g,'').slice(0,16),name='PlateWatch_'+dkey(t0)+'_'+p2(d.getHours())+'-'+p2(d.getMinutes())+'-'+p2(d.getSeconds())+'_'+cid+'_'+tg+'.'+ext;
    let w=null,fh=null,where='idb',pos=0,i=0,size=0,q=Promise.resolve();
    if(this.folder){try{let ok=(await this.folder.queryPermission({mode:'readwrite'}))==='granted';if(!ok)ok=(await this.folder.requestPermission({mode:'readwrite'}))==='granted';if(ok){fh=await this.folder.getFileHandle(name,{create:true});w=await fh.createWritable();where='folder'}}catch{w=null}if(!w)toast('Could not write to the chosen folder, so this recording is kept in the browser.','err')}
    try{await this.prune()}catch{}
    try{await this.recStart({name,cam:cam.id,camName:cam.cfg.name,tag,t:t0,mime:type,dur:0,size:0,open:true,where})}catch{toast('This browser cannot store recordings (private mode?).','err');return null}
    return{name,write(b){const k=i++;size+=b.size;q=q.then(async()=>{try{if(w){await w.write(b);pos+=b.size;if(k%60===59){await w.close();w=await fh.createWritable({keepExistingData:true});await w.seek(pos)}}else await DB.recChunk(name,k,b)}catch{}})},
      close(){q=q.then(async()=>{try{if(w){await w.close();w=null}}catch{}await DB.recEnd(name,{dur:Date.now()-t0,size,n:i});DB.audit('Recording saved '+name+' ('+where+')');DB.prune().catch(()=>{})});return q}}},
  async recBlob(r){if(r.where==='folder'){if(!this.folder)throw new Error('folder not chosen');if((await this.folder.queryPermission({mode:'read'}))!=='granted')await this.folder.requestPermission({mode:'read'});const fh=await this.folder.getFileHandle(r.name);return fh.getFile()}
    const ch=await this.t('chunks','readonly',tx=>tx.objectStore('chunks').getAll(IDBKeyRange.bound([r.name,0],[r.name,Number.MAX_SAFE_INTEGER])));return new Blob(ch.map(x=>x.blob),{type:(r.mime||'video/webm').split(';')[0]})},
  async recUrl(r){return URL.createObjectURL(await this.recBlob(r))},

/* ---------- tracker ---------- */
const iou=(a,b)=>{const x1=Math.max(a[0],b[0]),y1=Math.max(a[1],b[1]),x2=Math.min(a[0]+a[2],b[0]+b[2]),y2=Math.min(a[1]+a[3],b[1]+b[3]),i=Math.max(0,x2-x1)*Math.max(0,y2-y1);return i/((a[2]*a[3]+b[2]*b[3]-i)||1)};

}

  try{return await AI.ocrP}catch(e){AI.ocrP=null;throw e}}

const fixUK=s=>s.split('').map((ch,i)=>[0,1,4,5,6].includes(i)?(FIXL[ch]||ch):(FIXD[ch]||ch)).join('');

  if(region==='uk'){for(let i=0;i+7<=t.length;i++){const f=fixUK(t.slice(i,i+7));if(/^[A-Z]{2}\d{2}[A-Z]{3}$/.test(f))return f}
    for(let i=0;i<t.length;i++)for(const n of[7,6,5]){const f=t.slice(i,i+n);if(f.length<n)continue;if(/^[A-Z]\d{1,3}[A-Z]{3}$/.test(f)||/^[A-Z]{3}\d{1,3}[A-Z]$/.test(f))return f}return null}

    const sx=Math.max(0,(box[0]+box[2]*z[0])*W),sy=Math.max(0,(box[1]+box[3]*z[1])*H),sw=Math.min(W-sx,box[2]*z[2]*W),sh=Math.min(H-sy,box[3]*z[3]*H);if(sw<24||sh<12)continue;

const OCRQ=[];let ocrBusy=false;

/* ---------- scene description ---------- */
const trackActivity=t=>{if(!t)return'';if(t.speed<.03)return'standing still';return Math.abs(t.vx)>=Math.abs(t.vy)?'moving '+(t.vx>0?'right':'left'):(t.vy>0?'moving towards the camera':'moving away')};

  detail=detail||S.narr.detail;const T=cam.tracker.live();
  if(!cam.ready())return'The camera is not providing a picture.';

  ['pointerup','pointercancel'].forEach(ev=>cv.addEventListener(ev,e=>{if(PB.drag){PB.drag=false;pbSeek(PB.t,PB.wasPlaying||true)}}));

  const g=cv.getContext('2d');g.setTransform(dpr,0,0,dpr,0,0);const W=tl.w,H=tl.h,[w0,w1]=PB.win,css=getComputedStyle(document.documentElement),mut=css.getPropertyValue('--mut').trim(),bd=css.getPropertyValue('--bd').trim(),acc=css.getPropertyValue('--acc').trim();
  g.clearRect(0,0,W,H);

  for(let t=Math.ceil(w0/step)*step;t<=w1;t+=step){const x=xAt(t);g.beginPath();g.moveTo(x,18);g.lineTo(x,H);g.stroke();const d=new Date(t);g.fillText(p2(d.getHours())+':'+p2(d.getMinutes()),x+3,3)}
  const by=26,bh=38;g.fillStyle='rgba(120,140,160,.10)';g.fillRect(0,by,W,bh);
  PB.recs.forEach(r=>{const x0=xAt(r.t),x1=xAt(r.t+(r.dur||1000));if(x1<0||x0>W)return;g.fillStyle=TAGC[r.tag]||'#9aa4b5';g.globalAlpha=PB.cur&&PB.cur.name===r.name?1:.75;g.fillRect(Math.max(0,x0),by,Math.max(2,Math.min(W,x1)-Math.max(0,x0)),bh)});g.globalAlpha=1;

  const sync=()=>{const t=$('#ct').value;$('#cdev').style.display=t==='device'?'':'none';$('#curl').style.display=['mjpeg','snapshot'].includes(t)?'':'none'};$('#ct').onchange=sync;sync();
  const read=()=>{const t=$('#ct').value,dv=$('#cdv').value,n=Object.assign({},cfg,{name:$('#cn').value.trim()||'Camera',type:t,url:$('#cu').value.trim(),fps:+$('#cf').value||6,rec:$('#cr').value,detect:$('#cd').value==='1'});if(t==='device'){if(dv==='rear'||dv==='front'){n.facing=dv;n.deviceId=''}else{n.deviceId=dv}}return n};
  $('#ctestb').onclick=async()=>{const n=read();$('#ctest').textContent='Testing…';if(n.type==='device'){$('#ctest').textContent='Device cameras are tested when they start.';return}const ok=await new Promise(res=>{const i=new Image();i.crossOrigin='anonymous';i.onload=()=>res(1);i.onerror=()=>res(0);i.src=n.url+(n.url.includes('?')?'&':'?')+'_='+Date.now();setTimeout(()=>res(0),8000)});$('#ctest').textContent=ok?'✓ Picture received':'✗ Could not read a picture. The camera may block browsers (CORS) or use http on an https page.'};
  $('#csave').onclick=()=>{Object.assign(cfg,read());saveCam(cfg,isNew);closeModal();toast('Camera saved')};
  $('#ccancel').onclick=closeModal;
  if(!isNew)$('#cdel').onclick=()=>{if(!confirm('Remove this camera?'))return;const c=App.cams.find(x=>x.id===cfg.id);if(c){c.stop();c.tile.remove();App.cams=App.cams.filter(x=>x!==c)}CAMCFG=CAMCFG.filter(x=>x.id!==cfg.id);saveCams();closeModal();renderCams();renderBarCams();audit('Removed camera '+cfg.name)}}
function saveCam(cfg,isNew){let cam;if(isNew){CAMCFG.push(cfg);cam=new Cam(cfg);App.cams.push(cam);$('#grid').appendChild(cam.tile)}else{const i=CAMCFG.findIndex(c=>c.id===cfg.id);CAMCFG[i]=cfg;cam=App.cams.find(c=>c.id===cfg.id);const typeChanged=cam.cfg.type!==cfg.type;cam.cfg=cfg;cam.nameEl.textContent=cfg.name;if(typeChanged){cam.stop();const old=cam.tile,idx=App.cams.indexOf(cam);const nc=new Cam(cfg);App.cams[idx]=nc;old.replaceWith(nc.tile);cam=nc}}
  saveCams();audit((isNew?'Added':'Updated')+' camera '+cfg.name);if(cfg.enabled!==false)cam.start();if(cfg.detect!==false)aiLoad();renderBarCams();return cam}

/* ----- settings ----- */
const SCHEMA=[
 {t:'Detection (free, on-device AI)',d:'Objects, people and number plates are found inside your browser. Nothing is sent to any service.',i:[['ai.minScore','Minimum confidence','range',.3,.9,.05],['ai.fps','Detection speed (frames per second)','range',2,15,1],['ai.ocr','Read number plates','tog'],['ai.region','Plate format','sel',[['uk','UK'],['eu','European'],['us','US / Canada'],['any','Other']]]]},
 {t:'Auto-follow and zoom',d:'The picture zooms in and out and pans to keep an object framed. Tap an object on the picture to follow it; tap again to release.',i:[['follow.on','Auto-follow objects','tog'],['follow.target','Follow priority','sel',[['auto','Smart: danger, then person, then vehicle'],['person','People first'],['vehicle','Vehicles first'],['largest','Largest object'],['centre','Nearest the centre']]],['follow.onlyDanger','Only follow dangerous things','tog'],['follow.minZoom','Widest view (zoom)','range',1,3,.25],['follow.maxZoom','Closest zoom','range',1.5,8,.5],['follow.smooth','Reaction speed','range',.03,.4,.01],['follow.pad','Space around the object','range',1.2,4,.1],['follow.hold','Return to wide view after (seconds)','range',1,30,1],['follow.plateZoom','Zoom closer on vehicles to read plates','tog'],['follow.classes','Follow these things','classes']]},
 {t:'Recording',d:'Files are saved locally, each named with its date and time. Continuous files are never longer than 30 minutes.',i:[['rec.mode','Default recording mode','sel',[['off','Off'],['motion','When something moves'],['alert','Only on alerts'],['continuous','Continuously']]],['rec.seg','Longest single file (minutes)','range',1,30,1],['rec.pre','Seconds kept before an event','range',0,10,1],['rec.post','Seconds kept after an event','range',5,120,5],['rec.bitrate','Quality','sel',[[800000,'Low (small files)'],[2500000,'Medium'],[6000000,'High']]],['rec.maxGB','Delete oldest when storage passes (GB, 0 = never)','range',0,500,5],['rec.retainDays','Keep recordings and alerts for (days, 0 = forever)','range',0,365,1]]},
 {t:'Narration (spoken descriptions)',d:'Uses your device’s built-in voices, so it is free and works offline. Critical alerts always interrupt.',i:[['narr.on','Speak descriptions and alerts','tog'],['narr.mode','When to speak','sel',[['alerts','Alerts only'],['changes','When the scene changes'],['interval','On a timer']]],['narr.interval','Timer (seconds)','range',10,300,5],['narr.minGap','Shortest gap between descriptions (seconds)','range',3,60,1],['narr.detail','How much detail','sel',[['brief','Brief'],['normal','Normal'],['full','Full (every object)']]],['narr.arrivals','Announce arrivals and departures','tog'],['narr.voice','Voice','voice'],['narr.rate','Speed','range',.6,1.6,.05],['narr.pitch','Pitch','range',.5,1.5,.05],['narr.vol','Volume','range',0,1,.05],['narr.quiet','Quiet hours (only critical alerts speak)','tog'],['narr.quietFrom','Quiet from','time'],['narr.quietTo','Quiet until','time']]},
 {t:'Sounds',i:[['sound.on','Alert sounds','tog'],['sound.vol','Volume','range',0,1,.05]]},
 {t:'Notifications',d:'Optional and free. ntfy.sh sends push messages to the ntfy phone app; a webhook posts to your own address.',i:[['notify.browser','Browser notifications','tog'],['notify.minSev','Send to phone for','sel',[['medium','Medium and above'],['high','High and above'],['critical','Critical only']]],['notify.ntfy','ntfy topic (leave empty to turn off)','text'],['notify.ntfyServer','ntfy server','text'],['notify.webhook','Webhook address','text']]},
 {t:'Privacy and display',i:[['privacy.mask','Blur people in saved pictures','sel',[['off','Off'],['people','Blur people']]],['ui.boxes','Show object boxes','tog'],['ui.labels','Show box labels','tog'],['ui.trails','Show movement trails','tog'],['ui.zones','Show zones','tog'],['ui.motion','Show motion outline','tog']]}];
const CLASSES=['person','car','truck','motorcycle','bus','bicycle','dog','cat','backpack','handbag','suitcase','knife','scissors','baseball bat'];
const ctl=(p,type,a,b,c)=>{const v=getp(S,p);const dv=v===undefined&&p.startsWith('ui.')?true:v;
  if(type==='tog')return`<span class="tog"><input type="checkbox" data-p="${p}" ${dv?'checked':''}><span></span></span>`;
  if(type==='sel')return`<select data-p="${p}">${a.map(([k,l])=>`<option value="${esc(k)}"${String(k)===String(v)?' selected':''}>${esc(l)}</option>`).join('')}</select>`;
  if(type==='range')return`<input type="range" data-p="${p}" min="${a}" max="${b}" step="${c}" value="${v}"><span class="hint" data-o="${p}" style="min-width:42px;text-align:right">${v}</span>`;
  if(type==='time')return`<input type="time" data-p="${p}" value="${esc(v)}">`;
  if(type==='text')return`<input type="text" data-p="${p}" value="${esc(v)}" style="width:min(48%,260px)">`;
  if(type==='voice')return`<select data-p="${p}"><option value="">Default voice</option>${SP.voices.map(x=>`<option value="${esc(x.name)}"${x.name===v?' selected':''}>${esc(x.name)} (${esc(x.lang)})</option>`).join('')}</select><button class="btn sm" data-act="voicetest" data-i="speaker">Test</button>`;
  if(type==='classes')return`<span style="display:flex;gap:5px;flex-wrap:wrap;justify-content:flex-end;max-width:60%">${CLASSES.map(k=>`<label style="display:inline-flex;gap:4px;align-items:center;background:var(--card2);padding:3px 8px;border-radius:99px;font-size:12px"><input type="checkbox" data-cls="${k}" ${S.follow.classes.includes(k)?'checked':''}>${k}</label>`).join('')}</span>`;return''};
function renderSettings(){
  let h=SCHEMA.map(s=>`<div class="card"><h3>${s.t}</h3>${s.d?`<p class="hint" style="margin:-4px 0 8px">${s.d}</p>`:''}${s.i.map(([p,l,t,a,b,c])=>`<div class="set-row"><label>${l}</label>${ctl(p,t,a,b,c)}</div>`).join('')}</div>`).join('');
  h+=`<div class="card"><h3>Alerts: what counts as dangerous, and how it sounds</h3><p class="hint" style="margin:-4px 0 8px">Every kind of alert has its own severity, sound, and actions. Critical and high alerts interrupt narration and can start recording and push notifications.</p><div style="overflow:auto"><table class="rules"><tr><th>On</th><th>Alert</th><th>Severity</th><th>Sound</th><th>Record</th><th>Push</th><th>Speak</th><th>Settings</th></tr>`+
   Object.keys(KINDS).map(k=>{const r=rule(k),sel=(f,list,v)=>`<select data-r="${k}.${f}">${list.map(([a,b])=>`<option value="${a}"${a===v?' selected':''}>${b}</option>`).join('')}</select>`,ck=f=>`<span class="tog"><input type="checkbox" data-r="${k}.${f}" ${r[f]?'checked':''}><span></span></span>`;
     const prm=[r.secs!==undefined?`<label class="hint">seconds <input type="number" data-r="${k}.secs" value="${r.secs}" style="width:64px"></label>`:'',r.dist!==undefined?`<label class="hint">distance <input type="number" step=".05" data-r="${k}.dist" value="${r.dist}" style="width:64px"></label>`:'',r.speed!==undefined?`<label class="hint">speed <input type="number" step=".05" data-r="${k}.speed" value="${r.speed}" style="width:64px"></label>`:'',r.n!==undefined?`<label class="hint">people <input type="number" data-r="${k}.n" value="${r.n}" style="width:56px"></label>`:'',r.mins!==undefined?`<label class="hint">minutes <input type="number" data-r="${k}.mins" value="${r.mins}" style="width:56px"></label>`:'',r.from!==undefined?`<label class="hint">from <input type="time" data-r="${k}.from" value="${r.from}"></label> <label class="hint">to <input type="time" data-r="${k}.to" value="${r.to}"></label>`:''].join(' ');
     return`<tr><td><span class="tog"><input type="checkbox" data-r="${k}.on" ${r.on?'checked':''}><span></span></span></td><td><b>${esc(KINDS[k].l)}</b><div class="hint">${esc(KINDS[k].d)}</div></td><td>${sel('sev',Object.keys(SEV).map(s=>[s,SEV[s].l]),r.sev)}</td><td>${sel('snd',SOUND_NAMES,r.snd)} <button class="btn sm" data-test="${k}">Test</button></td><td>${ck('rec')}</td><td>${ck('notify')}</td><td>${ck('speak')}</td><td>${prm}</td></tr>`}).join('')+`</table></div></div>`;
  h+=`<div class="card"><h3>Number plate watchlist</h3><div class="row" style="margin-top:0"><input id="wp" type="text" placeholder="AB12 CDE" style="width:130px;text-transform:uppercase"><input id="wl" type="text" placeholder="Label (optional)" style="flex:1;min-width:110px"><select id="wt"><option value="alert">Alert me</option><option value="known">Known</option><option value="vip">VIP</option></select><button class="btn pri" id="wa">Add</button></div><div id="wlist"></div></div>`;
  h+=`<div class="card"><h3>System</h3><div class="row" style="margin-top:0"><button class="btn" data-act="diag" data-i="eye">Run diagnostics</button><button class="btn" data-act="audit" data-i="shield">Audit log</button><button class="btn" data-act="folder" data-i="folder">Choose recordings folder</button><button class="btn" data-act="nofolder">Use browser storage</button><button class="btn" data-act="export" data-i="download">Export settings</button><label class="btn"><input type="file" id="imp" accept=".json" hidden>Import settings</label></div><div id="sysout" class="hint" style="margin-top:10px;line-height:1.8;white-space:pre-wrap"></div></div>`;
  $('#setBody').innerHTML=h;hydrate($('#setBody'));renderWatch()}
function renderWatch(){const l=$('#wlist');if(!l)return;l.innerHTML=WATCH.length?WATCH.map((w,i)=>`<div class="camrow"><span class="nm"><b>${esc(fmtPlate(w.plate))}</b><small>${esc(w.label||'')}</small></span><span class="sev" style="--c:${w.type==='alert'?SEV.critical.c:w.type==='vip'?'#bf5af2':SEV.info.c}">${w.type.toUpperCase()}</span><button class="btn sm danger" data-wd="${i}">Remove</button></div>`).join(''):'<div class="empty">No plates yet.</div>'}
$('#setBody').addEventListener('input',e=>{const t=e.target,p=t.dataset.p;if(p&&t.type==='range'){const o=$(`[data-o="${p}"]`);if(o)o.textContent=t.value}});
$('#setBody').addEventListener('change',e=>{const t=e.target;
  if(t.dataset.p){const p=t.dataset.p;let v=t.type==='checkbox'?t.checked:t.type==='range'||t.type==='number'?+t.value:t.value;if(p==='rec.bitrate')v=+v;setp(S,p,v);saveSettings();if(p==='narr.on')$('#narrBtn').classList.toggle('on',v);if(p==='follow.on')UI.syncFollow();if(p==='sound.on'){setI($('#bSound'),v?'speaker':'mute');$('#bSound').classList.toggle('off',!v)}}
  else if(t.dataset.cls){const s=new Set(S.follow.classes);t.checked?s.add(t.dataset.cls):s.delete(t.dataset.cls);S.follow.classes=[...s];saveSettings()}
  else if(t.dataset.r){const[k,f]=t.dataset.r.split('.');S.rules[k]=Object.assign({},S.rules[k]);let v=t.type==='checkbox'?t.checked:t.type==='number'?+t.value:t.value;S.rules[k][f]=v;saveSettings()}
  else if(t.id==='imp'&&t.files[0]){t.files[0].text().then(x=>{try{const o=JSON.parse(x);S=merge(DEF,o.settings||{});if(o.watch)WATCH=o.watch;saveSettings();saveWatch();toast('Settings imported');renderSettings()}catch{toast('That file is not valid','err')}})}});
$('#setBody').addEventListener('click',async e=>{const b=e.target.closest('button');if(!b)return;
  if(b.dataset.test){const r=rule(b.dataset.test);playSound(r.snd,true)}
  else if(b.id==='wa'){const p=norm($('#wp').value);if(p.length<2)return;WATCH=WATCH.filter(w=>w.plate!==p).concat({plate:p,label:$('#wl').value.trim(),type:$('#wt').value});saveWatch();$('#wp').value='';$('#wl').value='';renderWatch()}
  else if(b.dataset.wd){WATCH.splice(+b.dataset.wd,1);saveWatch();renderWatch()}
  else if(b.dataset.act==='voicetest')speak('This is how the scene narration will sound.',2);
  else if(b.dataset.act==='export'){const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([JSON.stringify({settings:S,watch:WATCH,cameras:CAMCFG},null,1)],{type:'application/json'}));a.download='plate-watch-settings.json';a.click()}
  else if(b.dataset.act==='audit'){try{const[rows,v]=await Promise.all([DB.auditList(60),DB.auditVerify()]);$('#sysout').textContent=(v.ok?'✓ Audit chain intact ('+v.total+' entries)':'✗ Audit chain broken at entry '+v.brokenAt)+'\n'+rows.map(r=>dt(r.t)+'  '+r.a).join('\n')}catch(e){$('#sysout').textContent='Audit log unavailable: '+e.message}}
  else if(b.dataset.act==='folder'){await DB.pickFolder();renderSettings()}else if(b.dataset.act==='nofolder'){await DB.clearFolder();renderSettings()}else if(b.dataset.act==='diag')runDiag()});
async function runDiag(){const L=[],ok=(n,x)=>L.push((x?'✓ ':'✗ ')+n);ok('Secure address (HTTPS or localhost)',window.isSecureContext);ok('Camera API available',!!(navigator.mediaDevices&&navigator.mediaDevices.getUserMedia));
  try{const p=await navigator.permissions.query({name:'camera'});L.push('• Camera permission: '+p.state)}catch{}
  try{const d=await navigator.mediaDevices.enumerateDevices();L.push('• Cameras found: '+d.filter(x=>x.kind==='videoinput').length)}catch{}
  ok('Browser storage (IndexedDB)',!!window.indexedDB);ok('Save to a folder (Chrome or Edge)',!!window.showDirectoryPicker);L.push('• Recordings are kept: '+(DB.folder?'in the folder “'+DB.folder.name+'”':'in the browser'));
  ok('Recording (MediaRecorder)',!!window.MediaRecorder);ok('Spoken narration',SP.ok);L.push('• Voices: '+SP.voices.length);ok('Notifications allowed',window.Notification&&Notification.permission==='granted');ok('On-device AI loaded',AI.status==='ready');if(AI.err)L.push('  '+AI.err);ok('Screen wake lock',!!navigator.wakeLock);
  $('#sysout').textContent=L.join('\n')}
if(SP.ok)speechSynthesis.addEventListener('voiceschanged',()=>{if(UI.view==='set')renderSettings()});

/* ----- boot ----- */
(async function boot(){
  await loadAll();document.documentElement.dataset.theme=S.ui.theme||'dark';hydrate();setI($('#bSound'),S.sound.on?'speaker':'mute');$('#bSound').classList.toggle('off',!S.sound.on);$('#narrBtn').classList.toggle('on',!!S.narr.on);
  App.cams=CAMCFG.map(c=>new Cam(c));renderGrid();renderScene();UI.syncFollow();
  if(App.cams.some(c=>c.cfg.detect!==false))aiLoad();
  App.cams.forEach(c=>{if(c.cfg.enabled!==false)c.start()});
  aiLoop();requestAnimationFrame(frameLoop);pbInit();pbFill();await loadEvents();renderAlerts();
  setInterval(barTick,1000);setInterval(renderScene,1500);setInterval(storTick,20000);storTick();barTick();
  document.addEventListener('pointerdown',()=>{if('Notification' in window&&Notification.permission==='default'&&S.notify.browser)Notification.requestPermission().catch(()=>{})},{once:true});
  if(!API.online)toast('This browser cannot store anything (private mode?). Live view still works.','err');
  if('wakeLock' in navigator){const wl=()=>navigator.wakeLock.request('screen').catch(()=>{});wl();document.addEventListener('visibilitychange',()=>{if(document.visibilityState==='visible')wl()})}
})();
